<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Командный центр</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <div class="container text-center">
        
        <div id="home-ui">
            <h2>Командный центр</h2>
            <p id="status-msg" class="status-msg text-muted">Загрузка скриптов...</p>
            
            <button class="btn btn-block" disabled onclick="startCamera('login')">Вход по лицу</button>
            <button class="btn btn-block btn-secondary" disabled onclick="startCamera('register')">Запрос доступа</button>
            
            <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
                <a href="admin.html" class="btn btn-secondary" style="font-size: 14px;">Вход для Администратора</a>
            </div>
        </div>

        <div id="camera-ui" style="display: none;">
            <h2 id="camera-title">Распознавание</h2>
            
            <div class="video-box">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas-overlay"></canvas>
            </div>
            
            <p id="camera-msg" class="status-msg"></p>

            <div id="register-controls" style="display: none;">
                <input type="text" id="username" class="input-text" placeholder="Придумайте логин (Имя)">
                <button id="reg-btn" class="btn btn-block btn-success" onclick="captureAndRegister()">Отправить заявку</button>
            </div>

            <button class="btn btn-block btn-secondary mt-4" onclick="stopCamera()">Назад</button>
        </div>

    </div>

    <script src="js/db.js"></script>
    <script src="js/face-auth.js"></script>
</body>
</html>
