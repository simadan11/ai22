<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EDIT — мобильный ассистент</title>
  <meta name="description" content="EDIT — персональный AI-ассистент для телефона и наушников">
  <meta name="theme-color" content="#00d4ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ── Экран входа ─────────────────────────────────────────────── -->
  <div id="login" class="login">
    <div class="particles" id="particles"></div>
    <div class="login-card glass">
      <div class="logo-ring">
        <div class="logo-core">E</div>
      </div>
      <div class="login-title">EDIT</div>
      <div class="login-sub">персональный AI-ассистент</div>

      <div class="field">
        <label for="pass">Пароль</label>
        <div class="field-row">
          <input id="pass" class="input" type="password" placeholder="••••••" autocomplete="current-password">
          <button id="eye" class="eye" type="button" aria-label="Показать пароль">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="apikey">API-ключ Gemini</label>
        <input id="apikey" class="input mono" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
        <div class="field-hint">Ключ хранится только на этом устройстве</div>
      </div>

      <button id="login-btn" class="btn primary wide">ВОЙТИ</button>
      <div id="login-err" class="login-err"></div>
      <div class="login-foot">
        <span id="lock-state" class="lock-state">🔒 защищённый вход</span>
      </div>
    </div>
  </div>

  <!-- ── Основной чат ─────────────────────────────────────────────── -->
  <div id="app" class="app">
    <header>
      <div class="logo"><span class="dot-cyan"></span>EDIT</div>
      <div class="pill" id="pill"><span class="dot"></span><span id="st">...</span></div>
      <div class="spacer"></div>
      <button id="tts-btn" class="icon-btn" title="Озвучка ответов">🔊</button>
      <button id="hp-btn" class="icon-btn" title="Наушники: кнопка наушника = «говорить»">🎧</button>
    </header>

    <main id="feed" class="feed"></main>

    <footer class="inputbar">
      <input id="inp" class="chat-input" placeholder="Скажи или напиши EDIT…" autocomplete="off">
      <button id="mic-btn" class="mic-btn" title="Голосовой ввод">
        <span class="mic-ico">🎤</span>
      </button>
      <button id="send-btn" class="send-btn" title="Отправить">➤</button>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
