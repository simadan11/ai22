<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EDIT — мобильный ассистент</title>
  <meta name="description" content="EDIT — персональный AI-ассистент для телефона и наушников">
  <meta name="theme-color" content="#00d4ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ── Экран входа ─────────────────────────────────────────────── -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo"><span class="dot-cyan"></span>EDIT</div>
      <div class="login-sub">персональный AI-ассистент</div>
      <input id="pass" class="login-input" type="password" placeholder="Пароль" autocomplete="current-password" inputmode="text">
      <button id="login-btn" class="btn primary wide">ВОЙТИ</button>
      <div id="login-err" class="login-err"></div>
      <div class="login-hint">пароль по умолчанию — <b>gelius</b></div>
    </div>
  </div>

  <!-- ── Основной чат ─────────────────────────────────────────────── -->
  <div id="app" class="app">
    <header>
      <div class="logo"><span class="dot-cyan"></span>EDIT</div>
      <div class="pill" id="pill"><span class="dot"></span><span id="st">...</span></div>
      <div class="spacer"></div>
      <button id="hp-btn" class="icon-btn" title="Наушники: кнопка наушника = «говорить»">🎧</button>
      <button id="tts-btn" class="icon-btn" title="Озвучка ответов">🔊</button>
    </header>

    <main id="feed" class="feed"></main>

    <footer class="inputbar">
      <input id="inp" class="chat-input" placeholder="Скажи или напиши EDIT…" autocomplete="off">
      <button id="mic-btn" class="icon-btn big" title="Голосовой ввод">🎤</button>
      <button id="send-btn" class="btn primary" title="Отправить">➤</button>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
