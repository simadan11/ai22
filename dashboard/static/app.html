<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    #spk-btn, #dev-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 4px 9px; font-size: 13px; border-radius: 6px; cursor: pointer; line-height: 1.25;
    }
    #spk-btn:active, #dev-btn:active { transform: scale(0.95); }
    #spk-btn.muted  { opacity: 0.45; }
    #dev-btn #dev-count { font-size: 10px; font-weight: 700; color: var(--green); }

    /* ── DEVICES HUB PANEL ── */
    #dev-panel {
      position: fixed; top: 54px; right: 10px; z-index: 220;
      width: min(310px, 88vw); display: none;
      background: rgba(7,10,16,0.97); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    #dev-panel.open { display: block; animation: pop 0.18s ease; }
    .dp-title { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; }
    .dp-empty { font-size: 11px; color: var(--muted); padding: 6px 0; }
    .dp-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 6px; font-size: 11px;
    }
    .dp-meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dp-meta b { color: var(--text); font-weight: 700; }
    .dp-meta i { color: var(--muted); font-style: normal; font-size: 10px; }
    .dp-kick {
      flex-shrink: 0; background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 5px;
      font-size: 9px; font-weight: 800; letter-spacing: 1px;
      padding: 3px 8px; cursor: pointer; font-family: inherit;
    }
    .dp-kick:hover { color: #f87171; border-color: #7f2d2d; }
    .dp-paired {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; color: var(--muted); margin-top: 4px;
    }
    #dp-revoke {
      background: transparent; color: #f87171; border: 1px solid #7f2d2d;
      border-radius: 5px; font-size: 9px; font-weight: 800; letter-spacing: 1px;
      padding: 4px 8px; cursor: pointer; font-family: inherit; opacity: 0.85;
    }
    #dp-revoke:hover { opacity: 1; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── CAM BUTTON ── */
    #cam-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #cam-btn:hover  { opacity: 0.82; border-color: #22d3ee; color: #22d3ee; }
    #cam-btn:active { transform: scale(0.96); }

    /* ── EDITH CAMERA OVERLAY ── */
    #cam-overlay {
      position: fixed; inset: 0; z-index: 100; background: #000;
      display: none; overflow: hidden;
      font-family: 'SFMono-Regular', Consolas, 'Roboto Mono', monospace;
    }
    #cam-overlay.open { display: block; }
    #cam-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; filter: saturate(0.85) contrast(1.08);
    }
    #cam-boxes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .tag {
      position: absolute; border: 1.5px solid #22d3ee; border-radius: 3px;
      box-shadow: 0 0 12px rgba(34,211,238,0.25); animation: tag-pop .25s ease;
      pointer-events: auto;
    }
    .tag-info { cursor: pointer; }
    .tag-info:hover { box-shadow: 0 0 18px rgba(34,211,238,0.6); }
    .tag-info:active { transform: scale(0.98); }
    @keyframes tag-pop { from { opacity: 0; transform: scale(1.15); } }
    .tag-p { border-color: #f97316; box-shadow: 0 0 12px rgba(249,115,22,0.35); }
    .tag-f { border-color: #00d4ff; box-shadow: 0 0 14px rgba(0,212,255,0.45); }
    .tag-f .tag-l { background: #00d4ff; }
    .tag-fk { border-color: #00ffa8; box-shadow: 0 0 16px rgba(0,255,168,0.55); }
    .tag-fk .tag-l { background: #00ffa8; }
    .tag-fk .tag-d { color: #7dffd0; }
    .tag-v { border-color: #facc15; box-shadow: 0 0 12px rgba(250,204,21,0.35); }
    .tag-v .tag-l { background: #facc15; }
    .tag-v .tag-d { color: #fde68a; }
    .tag-l {
      position: absolute; top: -1.5px; left: -1.5px; transform: translateY(-100%);
      font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #04070c;
      background: #22d3ee; padding: 2px 7px; border-radius: 2px 2px 0 0;
      white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    .tag-p .tag-l { background: #f97316; }
    .tag-d {
      position: absolute; bottom: -1.5px; left: -1.5px; transform: translateY(100%);
      font-size: 9px; letter-spacing: 0.5px; color: #67e8f9; white-space: nowrap;
      text-shadow: 0 1px 3px #000;
    }
    .tag-p .tag-d { color: #fdba74; }
    /* ── EDITH person effect: silhouette aura + bone rig ──────────────── */
    #cam-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #cam-fx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .fx-aura {
      fill: rgba(255,165,0,0.13); stroke: #ffa500; stroke-width: 2.5;
      stroke-linejoin: round; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255,165,0,0.95))
              drop-shadow(0 0 16px rgba(255,140,0,0.55));
      animation: fx-breathe 1.6s ease-in-out infinite;
    }
    .fx-aura-glow {
      fill: none; stroke: #ff8c00; stroke-width: 9; stroke-linejoin: round;
      opacity: 0.28; filter: blur(4px);
      animation: fx-breathe 1.6s ease-in-out infinite;
    }
    .fx-bone {
      stroke: #ff2d3d; stroke-width: 2.4; stroke-linecap: round; fill: none;
      filter: drop-shadow(0 0 4px rgba(255,45,61,0.9));
    }
    .fx-joint { fill: #fff0f0; stroke: #ff2d3d; stroke-width: 1.4; }
    .fx-sweep {
      stroke: #fff2cc; stroke-width: 2; opacity: 0.85;
      filter: drop-shadow(0 0 6px rgba(255,220,150,0.9));
      animation: fx-sweep 2.2s linear infinite;
    }
    @keyframes fx-breathe { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes fx-sweep   { 0% { transform: translateY(0); } 100% { transform: translateY(var(--fxh, 100px)); } }
    @keyframes fx-in      { from { opacity: 0; } to { opacity: 1; } }
    .fx-g { animation: fx-in .3s ease; }

    .cam-scanline {
      position: absolute; left: 0; right: 0; height: 90px; pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(34,211,238,0.10), transparent);
      animation: scan-move 4.5s linear infinite;
    }
    @keyframes scan-move { 0% { top: -15%; } 100% { top: 110%; } }
    .cf { position: absolute; width: 34px; height: 34px; border: 2px solid rgba(34,211,238,0.85); pointer-events: none; }
    .cf-tl { top: 14px;    left: 14px;  border-right: none; border-bottom: none; }
    .cf-tr { top: 14px;    right: 14px; border-left: none;  border-bottom: none; }
    .cf-bl { bottom: 92px; left: 14px;  border-right: none; border-top: none; }
    .cf-br { bottom: 92px; right: 14px; border-left: none;  border-top: none; }
    .cam-top {
      position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center;
      gap: 10px; padding: 24px 22px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }
    .cam-title { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #22d3ee; }
    .cam-title em { font-style: normal; color: rgba(221,227,237,0.5); letter-spacing: 1.5px; font-size: 10px; }
    .cam-targets { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #f97316; }
    .cam-x {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #dde3ed; width: 34px; height: 34px; border-radius: 50%;
      font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .cam-status {
      position: absolute; left: 20px; bottom: 82px; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; color: #22d3ee; text-shadow: 0 1px 3px #000; pointer-events: none;
    }
    #cam-log {
      position: absolute; left: 12px; right: 12px; bottom: 112px; display: flex;
      flex-direction: column; gap: 4px; pointer-events: none;
    }
    .cam-log-line {
      align-self: flex-start; max-width: 88%; font-size: 11px; line-height: 1.5;
      padding: 6px 10px; border-radius: 8px; background: rgba(4,8,14,0.72);
      border-left: 2px solid #22d3ee; color: #cfdae8; animation: pop 0.18s ease;
    }
    .cam-log-line.ul { border-left-color: #6366f1; }
    .cam-controls {
      position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }
    #cam-q {
      flex: 1; padding: 12px 14px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(34,211,238,0.35); border-radius: 10px; color: #dde3ed;
      font-size: 13px; font-family: inherit; outline: none;
    }
    #cam-q::placeholder { color: rgba(221,227,237,0.35); }
    #cam-scan {
      padding: 0 22px; background: #22d3ee; border: none; border-radius: 10px;
      color: #04070c; font-size: 13px; font-weight: 800; letter-spacing: 2px;
      cursor: pointer; font-family: inherit;
    }
    #cam-scan:active { transform: scale(0.96); }
    #cam-live {
      padding: 0 14px; background: transparent; border: 1px solid rgba(34,211,238,0.5);
      border-radius: 10px; color: #22d3ee; font-size: 12px; font-weight: 800;
      letter-spacing: 1.5px; cursor: pointer; font-family: inherit;
    }
    #cam-live:active { transform: scale(0.96); }
    #cam-live.on {
      background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.55);
      color: #ef4444; animation: mic-pulse 1s ease-in-out infinite;
    }
    #cam-flip {
      padding: 0 14px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      color: #dde3ed; font-size: 16px; cursor: pointer;
    }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      z-index: 300;
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <button id="dev-btn" onclick="toggleDevPanel()" title="Connected devices hub">🛰 <span id="dev-count">0</span></button>
    <button id="spk-btn" onclick="toggleSpk()" title="JARVIS voice on this device">🔊</button>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <!-- ── Devices hub panel ───────────────────────────────────────────── -->
  <div id="dev-panel">
    <div class="dp-title">◈ DEVICES HUB</div>
    <div id="dev-list"><div class="dp-empty">loading…</div></div>
    <div class="dp-paired">paired devices: <span id="dp-paired-n">0</span>
      <button id="dp-revoke" onclick="revokePaired()">REVOKE ALL</button>
    </div>
  </div>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="cam-btn" onclick="openCamera()" title="Phone camera — EDITH vision">📷</button>
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <!-- ── EDITH camera overlay ─────────────────────────────────────────── -->
  <div id="cam-overlay">
    <video id="cam-video" autoplay playsinline muted></video>
    <div id="cam-fx"></div>
    <div id="cam-boxes"></div>
    <div class="cam-scanline"></div>
    <span class="cf cf-tl"></span><span class="cf cf-tr"></span>
    <span class="cf cf-bl"></span><span class="cf cf-br"></span>
    <div class="cam-top">
      <span class="cam-title">E.D.I.T.H <em>// PHONE OPTICS</em></span>
      <span class="cam-targets" id="cam-targets">NO TARGETS</span>
      <button class="cam-x" onclick="closeCamera()" title="Close">✕</button>
    </div>
    <div id="cam-log"></div>
    <div class="cam-status" id="cam-status">INITIALIZING…</div>
    <div class="cam-controls">
      <input id="cam-q" placeholder="Ask about what you see… (optional)" autocomplete="off">
      <button id="cam-live" onclick="toggleLive()" title="Stream camera to PC">LIVE</button>
      <button id="cam-scan" onclick="doScan()">SCAN</button>
      <button id="cam-flip" onclick="flipCamera()" title="Flip camera">🔄</button>
    </div>
  </div>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);
    ws.binaryType  = 'arraybuffer';   // JARVIS voice streams as binary PCM

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      if (typeof e.data !== 'string') { _playSpk(e.data); return; }  // voice frame
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'devices')       _setDevCount(m.count);
      if (m.type === 'vision_status') sys(m.state === 'error' ? m.text : 'Phone camera: ' + m.state + '…');
      if (m.type === 'live_dets') {
        // PC-side live detection shared back → draw boxes on the phone too
        if (camOverlay.classList.contains('open') && Array.isArray(m.detections)) {
          _lastDets = m.detections;
          _drawBoxes();
        }
      }
      _onVisionMsg(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {

    function append(speaker, text) {

    function sys(text) {
      const d = document.createElement('div');

    function esc(s) {

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {

    // ── Commands ──────────────────────────────────────────────────────────────

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {

    // ── JARVIS voice on phone — 24 kHz PCM16 binary frames over /ws ──────────
    let _spkOn   = true;
    let _spkCtx  = null;
    let _spkNext = 0;   // scheduled end-time of the last queued buffer

    function toggleSpk() {
      _spkOn = !_spkOn;
      const b = document.getElementById('spk-btn');
      b.textContent = _spkOn ? '🔊' : '🔇';
      b.classList.toggle('muted', !_spkOn);
      toast(_spkOn ? 'JARVIS voice: ON' : 'JARVIS voice: OFF');
    }

    function _playSpk(buf) {
      if (!_spkOn) return;
      try {
        if (!_spkCtx) _spkCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        const ctx = _spkCtx;
        if (ctx.state === 'suspended') ctx.resume();   // unlocked by pointerdown below
        const i16 = new Int16Array(buf);
        const f32 = new Float32Array(i16.length);
        for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
        const ab = ctx.createBuffer(1, f32.length, 24000);
        ab.getChannelData(0).set(f32);
        const src = ctx.createBufferSource();
        src.buffer = ab;
        src.connect(ctx.destination);
        // fell >1.2 s behind (network hiccup) → resync instead of lagging
        if (_spkNext - ctx.currentTime > 1.2 || _spkNext < ctx.currentTime)
          _spkNext = ctx.currentTime + 0.15;   // 150 ms jitter cushion for LAN WiFi
        src.start(_spkNext);
        _spkNext += ab.duration;
      } catch (_) {}
    }

    // True while JARVIS audio is still queued on this phone's speaker —
    // used to keep the phone mic from echoing JARVIS back to himself
    function _spkActive() {
      return !!(_spkCtx && _spkNext > _spkCtx.currentTime + 0.15);
    }

    // mobile browsers keep AudioContext suspended until the first user gesture
    document.addEventListener('pointerdown', () => {
      if (_spkCtx && _spkCtx.state === 'suspended') _spkCtx.resume();
    }, { passive: true });

    // ── Devices hub panel ─────────────────────────────────────────────────────

    async function revokePaired() {

        const r = await _authFetch('/api/revoke-devices', { method: 'POST' });
        const d = await r.json();

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤📷 One-time mic & camera setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤 or 📷</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            if (_spkActive()) return;   // don't echo JARVIS's own voice back to him
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (_spkActive()) return;   // don't echo JARVIS's own voice back to him
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }

    // ── Phone Camera — EDITH Vision ───────────────────────────────────────────
    const camOverlay = document.getElementById('cam-overlay');
    const camVideo   = document.getElementById('cam-video');
    const camBoxes   = document.getElementById('cam-boxes');
    const camFx      = document.getElementById('cam-fx');
    const camStatus  = document.getElementById('cam-status');
    const camTargets = document.getElementById('cam-targets');
    const camLogEl   = document.getElementById('cam-log');
    let _camStream = null;
    let _facing    = 'environment';   // back camera by default — point it at the world
    let _scanning  = false;
    let _lastDets  = [];

    async function openCamera() {
      if (!navigator.mediaDevices?.getUserMedia) { _showVoiceSetup(); return; }
      camOverlay.classList.add('open');
      if (!_camStream) await _startCamStream();
    }

    async function _startCamStream() {
      _stopCamStream();
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: _facing }, width: { ideal: 1280 } },
          audio: false,
        });
      } catch (_) {
        try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
        catch (e2) {
          camStatus.textContent = (e2.name === 'NotAllowedError')
            ? 'CAMERA DENIED — allow camera in browser settings'
            : 'CAMERA ERROR: ' + (e2.message || e2.name);
          return;
        }
      }
      _camStream = stream;
      camVideo.srcObject = stream;
      // mirror selfie previews; rear camera stays natural
      camVideo.style.transform = (_facing === 'user') ? 'scaleX(-1)' : 'none';
      camStatus.textContent = 'LIVE FEED — TAP SCAN TO IDENTIFY';
    }

    function _stopCamStream() {
      if (_camStream) { _camStream.getTracks().forEach(t => t.stop()); _camStream = null; }
    }

    function closeCamera() {
      stopLive();
      camOverlay.classList.remove('open');
      _stopCamStream();
      camVideo.srcObject = null;
      _lastDets = [];
      camBoxes.innerHTML = ''; camFx.innerHTML = '';
      camTargets.textContent = 'NO TARGETS';
    }

    async function flipCamera() {
      stopLive();
      _facing = (_facing === 'environment') ? 'user' : 'environment';
      _lastDets = []; camBoxes.innerHTML = ''; camFx.innerHTML = '';
      if (camOverlay.classList.contains('open')) await _startCamStream();
    }

    function _grabFrame(MAX = 1280, Q = 0.8) {
      const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
      if (!vw || !vh) return null;
      const sc  = Math.min(1, MAX / Math.max(vw, vh));
      const c   = document.createElement('canvas');
      c.width   = Math.round(vw * sc);
      c.height  = Math.round(vh * sc);
      c.getContext('2d').drawImage(camVideo, 0, 0, c.width, c.height);
      return (c.toDataURL('image/jpeg', Q).split(',')[1]) || null;
    }

    function _b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out.buffer;
    }

    // ── LIVE — stream the phone camera onto the PC HUD ──────────────────────
    let _liveWs = null, _liveTimer = null, _liveRaf = null;

    function toggleLive() {
      if (_liveWs || _liveTimer) { stopLive(); return; }
      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-cam?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        _liveWs = ws;
        const btn = document.getElementById('cam-live');
        btn.classList.add('on'); btn.textContent = '⏹';
        camStatus.textContent = 'STREAMING TO PC — LIVE';
        toast('📡 Live on PC');
        // Target 60 FPS. Driven by requestAnimationFrame (which is already
        // vsync-aligned) instead of a fixed timer, and back-pressured on
        // ws.bufferedAmount so a slow link drops frames rather than piling
        // up latency.
        const FRAME_MS = 1000 / 60;
        let _lastSend = 0;
        const pump = (now) => {
          if (!_liveWs || ws.readyState !== 1) return;
          _liveRaf = requestAnimationFrame(pump);
          if (now - _lastSend < FRAME_MS) return;
          // skip while the socket is still draining the previous frames
          if (ws.bufferedAmount > 512 * 1024) return;
          _lastSend = now;
          const f = _grabFrame(640, 0.5);
          if (f) ws.send(_b64ToBytes(f));
        };
        _liveRaf = requestAnimationFrame(pump);
      };
      ws.onclose = () => stopLive();
      ws.onerror = () => stopLive();
    }

    function stopLive() {
      if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
      if (_liveRaf) { cancelAnimationFrame(_liveRaf); _liveRaf = null; }
      if (_liveWs) {
        const w = _liveWs; _liveWs = null;
        if (w.readyState < 2) w.close();
      }
      const btn = document.getElementById('cam-live');
      btn.classList.remove('on'); btn.textContent = 'LIVE';
      if (camOverlay.classList.contains('open'))
        camStatus.textContent = _lastDets.length ? 'ANALYSIS COMPLETE' : 'LIVE FEED — TAP SCAN TO IDENTIFY';
    }

    async function doScan() {
      if (_scanning) return;
      const frame = _grabFrame();
      if (!frame) { camStatus.textContent = 'NO VIDEO SIGNAL'; return; }
      _scanning = true;
      const btn = document.getElementById('cam-scan');
      btn.disabled = true; btn.style.opacity = '0.45'; btn.textContent = '···';
      const qInp = document.getElementById('cam-q');
      const question = qInp.value.trim();
      _lastDets = []; camBoxes.innerHTML = ''; camFx.innerHTML = '';
      camStatus.textContent  = 'SCANNING — ANALYZING FEED…';
      camTargets.textContent = 'PROCESSING…';
      const headers = Object.assign({ 'Content-Type': 'application/json' }, _authHeader());

      // 1) HUD detection → labeled boxes drawn right here on the overlay
      fetch('/api/vision-hud', { method: 'POST', headers, body: JSON.stringify({ frame }) })
        .then(r => r.json())
        .then(d => {
          if (d.ok && Array.isArray(d.detections)) { _lastDets = d.detections; _drawBoxes(); }
          else camTargets.textContent = 'HUD: ' + (d.error || 'OFFLINE');
        })
        .catch(() => { camTargets.textContent = 'HUD UPLINK FAILED'; })
        .finally(() => {
          _scanning = false; btn.disabled = false;
          btn.style.opacity = '1'; btn.textContent = 'SCAN';
        });

      // 2) Full analysis → JARVIS speaks the answer on the PC,
      //    while the transcript appears here and in the chat feed
      fetch('/api/vision-scan', { method: 'POST', headers, body: JSON.stringify({ frame, question }) })
        .then(r => r.json())
        .then(d => {
          if (d.ok) { toast('📷 Frame sent to JARVIS'); qInp.value = ''; }
          else camStatus.textContent = 'SCAN REJECTED: ' + (d.error || 'UNKNOWN');
        })
        .catch(() => { camStatus.textContent = 'UPLINK FAILED — CHECK CONNECTION'; });
    }

    document.getElementById('cam-q').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doScan(); }
    });

    // ── EDITH person effect: silhouette aura + skeleton ─────────────────────
    const _BONES = [
      ['head','neck'],['neck','l_shoulder'],['neck','r_shoulder'],
      ['l_shoulder','l_elbow'],['l_elbow','l_wrist'],
      ['r_shoulder','r_elbow'],['r_elbow','r_wrist'],
      ['neck','pelvis'],['l_shoulder','l_hip'],['r_shoulder','r_hip'],
      ['pelvis','l_hip'],['pelvis','r_hip'],['l_hip','r_hip'],
      ['l_hip','l_knee'],['l_knee','l_ankle'],
      ['r_hip','r_knee'],['r_knee','r_ankle'],
    ];

    function _fallbackRig(x, y, w, h) {
      const P = (fx, fy) => [x + w * fx, y + h * fy];
      return {
        head: P(.50,.07), neck: P(.50,.17),
        l_shoulder: P(.31,.21), r_shoulder: P(.69,.21),
        l_elbow: P(.22,.39),    r_elbow: P(.78,.39),
        l_wrist: P(.19,.56),    r_wrist: P(.81,.56),
        pelvis: P(.50,.53),
        l_hip: P(.38,.55),      r_hip: P(.62,.55),
        l_knee: P(.37,.75),     r_knee: P(.63,.75),
        l_ankle: P(.36,.96),    r_ankle: P(.64,.96),
      };
    }

    function _drawPersonFx(d, geom, x, y, w, h) {
      const { dw, dh, offX, offY, mirror } = geom;
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'fx-g');
      const mk = (t, attrs) => {
        const e = document.createElementNS(NS, t);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      };
      // normalized [y,x] (0-1000) → screen px, honouring mirror + object-fit cover
      const pt = q => {
        let ny = +q[0], nx = +q[1];
        if (!isFinite(ny) || !isFinite(nx)) return null;
        if (mirror) nx = 1000 - nx;
        return [(nx / 1000) * dw - offX, (ny / 1000) * dh - offY];
      };

      // 1) silhouette outline (fallback: rounded bounding box)
      let poly = null;
      if (Array.isArray(d.outline) && d.outline.length >= 4) {
        const pts = d.outline.slice(0, 40).map(pt).filter(Boolean);
        if (pts.length >= 4) poly = pts.map(p => p.join(',')).join(' ');
      }
      if (poly) {
        svg.appendChild(mk('polygon', { points: poly, class: 'fx-aura-glow' }));
        svg.appendChild(mk('polygon', { points: poly, class: 'fx-aura' }));
      } else {
        const r = { x, y, width: w, height: h, rx: 10, ry: 10 };
        svg.appendChild(mk('rect', { ...r, class: 'fx-aura-glow' }));
        svg.appendChild(mk('rect', { ...r, class: 'fx-aura' }));
      }

      // 2) bone rig
      const joints = {};
      if (d.pose && typeof d.pose === 'object') {
        for (const k in d.pose) {
          const p = pt(d.pose[k]);
          if (p) joints[k] = p;
        }
      }
      // A box-only detector (HOG) has no joints; a generic rig would draw a
      // skeleton unrelated to the real body, so skip bones entirely.
      const rig = Object.keys(joints).length >= 3
        ? joints
        : (d.no_skeleton ? {} : _fallbackRig(x, y, w, h));
      _BONES.forEach(([a, b]) => {
        if (!rig[a] || !rig[b]) return;
        svg.appendChild(mk('line', {
          x1: rig[a][0], y1: rig[a][1], x2: rig[b][0], y2: rig[b][1], class: 'fx-bone',
        }));
      });
      for (const k in rig) {
        const big = (k === 'head' || k === 'neck' || k === 'pelvis');
        svg.appendChild(mk('circle', {
          cx: rig[k][0], cy: rig[k][1], r: big ? 4 : 2.6, class: 'fx-joint',
        }));
      }

      // 3) scan line sweeping down the target
      const sweep = mk('line', { x1: x, y1: y, x2: x + w, y2: y, class: 'fx-sweep' });
      sweep.style.setProperty('--fxh', h + 'px');
      svg.appendChild(sweep);

      camFx.appendChild(svg);
    }

    function _drawBoxes() {
      camBoxes.innerHTML = ''; camFx.innerHTML = '';
      const vw = camVideo.videoWidth,  vh = camVideo.videoHeight;
      const cw = camVideo.clientWidth, ch = camVideo.clientHeight;
      if (!vw || !vh || !cw || !ch) return;
      // object-fit: cover geometry — boxes must land on the same pixels as the video
      const scale = Math.max(cw / vw, ch / vh);
      const dw = vw * scale, dh = vh * scale;
      const offX = (dw - cw) / 2, offY = (dh - ch) / 2;
      const mirror = (_facing === 'user');
      let persons = 0, vehicles = 0, faces = 0, drawn = 0;
      _lastDets.slice(0, 12).forEach(d => {
        if (!Array.isArray(d.box) || d.box.length !== 4) return;
        let [ymin, xmin, ymax, xmax] = d.box.map(Number);
        if (![ymin, xmin, ymax, xmax].every(isFinite)) return;
        const cl = v => Math.max(0, Math.min(1000, v));
        ymin = cl(ymin); xmin = cl(xmin); ymax = cl(ymax); xmax = cl(xmax);
        if (xmax - xmin < 5 || ymax - ymin < 5) return;
        if (mirror) { const t = xmin; xmin = 1000 - xmax; xmax = 1000 - t; }
        const el = document.createElement('div');
        el.className = 'tag' +
          (d.kind === 'person' ? ' tag-p'
           : d.kind === 'vehicle' ? ' tag-v'
           : d.kind === 'face' ? (d.known ? ' tag-f tag-fk' : ' tag-f')
           : '');
        // objects, vehicles, landmarks: tap → JARVIS looks it up & explains.
        // people and plates are intentionally NOT searchable.
        const _label = String(d.label || '');
        if (d.kind !== 'person' && d.kind !== 'face'
            && !/^PLATE\b/i.test(_label)) {
          el.classList.add('tag-info');
          el.addEventListener('click', () => _tagInfo(_label));
        }
        el.style.left   = ((xmin / 1000) * dw - offX) + 'px';
        el.style.top    = ((ymin / 1000) * dh - offY) + 'px';
        el.style.width  = (((xmax - xmin) / 1000) * dw) + 'px';
        el.style.height = (((ymax - ymin) / 1000) * dh) + 'px';
        const lab = document.createElement('span');
        lab.className = 'tag-l';
        lab.textContent = String(d.label || 'TARGET').toUpperCase().slice(0, 48);
        el.appendChild(lab);
        if (d.detail) {
          const det = document.createElement('span');
          det.className = 'tag-d';
          det.textContent = String(d.detail).slice(0, 70);
          el.appendChild(det);
        }
        camBoxes.appendChild(el);
        if (d.kind === 'person') {
          const px = ((xmin / 1000) * dw - offX);
          const py = ((ymin / 1000) * dh - offY);
          _drawPersonFx(d, { dw, dh, offX, offY, mirror }, px, py,
                        ((xmax - xmin) / 1000) * dw, ((ymax - ymin) / 1000) * dh);
        }
        drawn++;
        if (d.kind === 'person') persons++;
        else if (d.kind === 'vehicle') vehicles++;
        else if (d.kind === 'face') faces++;
      });
      camTargets.textContent = drawn
        ? `TARGETS: ${drawn} ▸ ${persons} PERSON · ${faces} FACE · ${vehicles} VEHICLE · ${drawn - persons - vehicles - faces} OBJECT`
        : 'NO TARGETS';
      if (drawn) camStatus.textContent = 'ANALYSIS COMPLETE — ANSWER INCOMING';
    }

    window.addEventListener('resize', () => { if (_lastDets.length) _drawBoxes(); });
    camVideo.addEventListener('resize',  () => { if (_lastDets.length) _drawBoxes(); });

    // ── Tap a tag → JARVIS searches & tells you about that thing ─────────────
    function _tagInfo(label) {
      const clean = label.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!clean) return;
      camStatus.textContent = 'LOOKUP: ' + clean.toUpperCase();
      toast('🔎 ' + clean);
      const q = `The user tapped the "${clean}" annotation on their phone camera HUD. ` +
                `Briefly explain what "${clean}" is — search the web if it is a specific ` +
                `product or place. One or two sentences.`;
      const enc = _encrypt(q);
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(enc ? { enc } : { text: q }),
      });
    }

    function _onVisionMsg(m) {
      if (!camOverlay.classList.contains('open')) return;
      if (m.type === 'vision_status') {
        if (m.state === 'received')      camStatus.textContent = 'FRAME RECEIVED BY JARVIS';
        else if (m.state === 'analyzing') camStatus.textContent = 'JARVIS IS ANALYZING…';
        else if (m.text)                  camStatus.textContent = String(m.text).toUpperCase();
      }
      // mirror conversation into the HUD while the overlay is open
      if (m.type === 'log') {
        const line = document.createElement('div');
        line.className = 'cam-log-line' + (m.speaker === 'jarvis' ? '' : ' ul');
        line.textContent = (m.speaker === 'jarvis' ? 'JARVIS ▸ ' : 'YOU ▸ ') + m.text;
        camLogEl.appendChild(line);
        while (camLogEl.children.length > 3) camLogEl.removeChild(camLogEl.firstChild);
      }
    }
  </script>
</body>
</html>
