<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EDIT Mobile</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-main">
  <div class="scanline"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">EDIT</span>
      <span class="brand-sub">mobile</span>
    </div>
    <div class="status" id="connStatus">
      <span class="dot"></span><span class="text">online</span>
    </div>
  </header>

  <main class="container">
    <!-- Hero / Приветствие -->
    <section class="hero">
      <div class="hero-avatar">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"></div>
      </div>
      <h1 id="greeting">Привет</h1>
      <p class="hero-sub" id="heroSub">Ассистент на связи. Выбери действие.</p>
    </section>

    <!-- Быстрые действия -->
    <section class="grid">
      <button class="tile t-blue" data-cmd="status">
        <div class="tile-ico">◉</div>
        <div class="tile-title">Статус</div>
        <div class="tile-sub">Проверить систему</div>
      </button>
      <button class="tile t-green" data-cmd="time">
        <div class="tile-ico">⏱</div>
        <div class="tile-title">Время</div>
        <div class="tile-sub">Сейчас на ПК</div>
      </button>
      <button class="tile t-purple" data-cmd="news">
        <div class="tile-ico">◐</div>
        <div class="tile-title">Новости</div>
        <div class="tile-sub">Свежий дайджест</div>
      </button>
      <button class="tile t-amber" data-cmd="notes">
        <div class="tile-ico">✎</div>
        <div class="tile-title">Заметка</div>
        <div class="tile-sub">Сохранить мысль</div>
      </button>
    </section>

    <!-- Текстовый ввод -->
    <section class="chat">
      <div class="chat-log" id="chatLog" aria-live="polite">
        <div class="msg msg-bot">
          <div class="msg-who">EDIT</div>
          <div class="msg-bubble">Готов к работе. Что сделать?</div>
        </div>
      </div>
      <form class="chat-input" id="chatForm" autocomplete="off">
        <input
          id="chatField"
          type="text"
          inputmode="text"
          placeholder="Скажи ассистенту…"
          aria-label="Сообщение"
        />
        <button type="submit" class="send-btn" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>
    </section>

    <!-- Нижняя панель -->
    <nav class="tabbar">
      <a href="/index.html" class="tab active">
        <span class="tab-ico">◉</span><span>Пульт</span>
      </a>
      <a href="/headphones.html" class="tab">
        <span class="tab-ico">🎧</span><span>Наушники</span>
      </a>
      <a href="#" class="tab" id="logoutBtn">
        <span class="tab-ico">⏻</span><span>Выйти</span>
      </a>
    </nav>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
