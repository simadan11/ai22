<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Вход · EDIT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-pin">
  <div class="scanline"></div>

  <main class="pin-wrap">
    <div class="pin-card">
      <div class="brand center">
        <span class="brand-dot"></span>
        <span class="brand-name">EDIT</span>
      </div>
      <h1>Введите PIN</h1>
      <p class="muted">4 цифры для доступа к пульту</p>

      <div class="pin-dots" id="pinDots" aria-label="PIN">
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="keypad">
        <button data-k="1">1</button>
        <button data-k="2">2</button>
        <button data-k="3">3</button>
        <button data-k="4">4</button>
        <button data-k="5">5</button>
        <button data-k="6">6</button>
        <button data-k="7">7</button>
        <button data-k="8">8</button>
        <button data-k="9">9</button>
        <button data-k="clr" class="key-act">C</button>
        <button data-k="0">0</button>
        <button data-k="back" class="key-act">⌫</button>
      </div>

      <p class="pin-err" id="pinErr"></p>
      <p class="muted small">PIN по умолчанию: <code>1234</code> · меняется в <code>api/auth.py</code></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const EXPECTED = "1234"; // дублируем для UX; реальная проверка — на сервере
    const dots = [...document.querySelectorAll('#pinDots span')];
    const err = document.getElementById('pinErr');
    let cur = "";

    function render() {
      dots.forEach((d, i) => d.classList.toggle('on', i < cur.length));
      err.textContent = "";
    }

    async function submit() {
      if (cur.length !== 4) return;
      try {
        const r = await API.auth(cur);
        if (r.ok && r.token) {
          localStorage.setItem('edit_token', r.token);
          location.href = '/index.html';
        } else {
          err.textContent = r.error || 'Неверный PIN';
          cur = ""; render();
        }
      } catch (e) {
        err.textContent = 'Нет связи с сервером';
        cur = ""; render();
      }
    }

    document.querySelectorAll('.keypad button').forEach(b => {
      b.addEventListener('click', () => {
        const k = b.dataset.k;
        if (k === 'clr') { cur = ""; }
        else if (k === 'back') { cur = cur.slice(0, -1); }
        else if (cur.length < 4) { cur += k; }
        render();
        if (cur.length === 4) setTimeout(submit, 120);
      });
    });

    // Авто-редирект если уже залогинен
    if (localStorage.getItem('edit_token')) location.href = '/index.html';
  </script>
</body>
</html>
