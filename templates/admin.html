<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администратор сайта</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; margin: 10px; border-radius: 8px; display: inline-block; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .card img { width: 150px; border-radius: 5px; }
        .actions { margin-top: 10px; }
        button { padding: 5px 10px; cursor: pointer; border: none; border-radius: 3px; color: white; }
        .btn-approve { background: #28a745; }
        .btn-reject { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Панель администратора</h2>
    <a href="/dashboard">Перейти в Командный центр</a>
    <hr>
    
    <h3>Заявки на доступ (Кто хочет войти на сайт)</h3>
    {% if not pending_data %}
        <p>Нет новых заявок.</p>
    {% else %}
        {% for pd in pending_data %}
        <div class="card">
            <h4>{{ pd.username }}</h4>
            <img src="{{ pd.photo }}" alt="Фото {{ pd.username }}">
            <div class="actions">
                <form action="/admin/approve" method="POST" style="display:inline;">
                    <input type="hidden" name="username" value="{{ pd.username }}">
                    <button type="submit" class="btn-approve">Добавить в доступ</button>
                </form>
                <form action="/admin/reject" method="POST" style="display:inline;">
                    <input type="hidden" name="username" value="{{ pd.username }}">
                    <button type="submit" class="btn-reject">Отклонить</button>
                </form>
            </div>
        </div>
        {% endendfor %}
    {% endif %}
</body>
</html>
